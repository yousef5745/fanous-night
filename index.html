<script>// ---- Core: generation + solver (pure, testable) ----
var DX=[0,1,0,-1],DY=[-1,0,1,0]; // 0 up,1 right,2 down,3 left

    // reverse construction: r=0 is removed last. removal index k=n-1-r ; launches before it = k
    var free=[];for(var i=0;i<cols*rows;i++)free.push(i);
    var spinLeft=P.spin;
    for(var r=0;r<n;r++){
      var k=n-1-r,placed=false;

      for(var t=free.length-1;t>0;t--){var j=Math.floor(R()*(t+1));var tmp=free[t];free[t]=free[j];free[j]=tmp;}
      for(var fi=0;fi<free.length&&!placed;fi++){
        var cell=free[fi],x=cell%cols,y=Math.floor(cell/cols),d0=Math.floor(R()*4);

          if(pathClear(cols,rows,occ,x,y,d,-1).ok){
            var sp=spinLeft>0&&R()<(spinLeft/(n-r))*1.6;
            var id=pieces.length;
            pieces.push({id:id,x:x,y:y,spin:sp,d:d,r:r,c:Math.floor(R()*P.colors)});
            if(sp)spinLeft--;

        }

  var path=[];
  function key(){var s='';for(var i=0;i<N;i+=30){var v=0;for(var j=i;j<Math.min(N,i+30);j++)v=v*2+rem[j];s+=v.toString(36)+',';}return s;}

    cand.sort(function(a,b){return (lv.pieces[a].spin?1:0)-(lv.pieces[b].spin?1:0);});
    for(var c=0;c<cand.length;c++){var id=cand[c];rem[id]=1;cnt++;path.push(id);
      if(rec())return true;rem[id]=0;cnt--;path.pop();if(nodes>cap)return false;}
    dead.add(k);return false;
  }
  return rec()?path:null;
}

function render(now,dt){drawBg(now);if(!lv)return;drawBoard();var s=B.s;
 // spin tween
 lv.pieces.forEach(function(p){var target=dirOf(p)*Math.PI/2,v=spinVis[p.id];var diff=target-v;while(diff>Math.PI)diff-=6.283;while(diff<-Math.PI)diff+=6.283;spinVis[p.id]=v+diff*Math.min(1,dt*12);});
 var off={},flying={};anims.forEach(function(a){if(a.type==='bump'){var k=a.t<0.5?eob(a.t*2):1-ease((a.t-0.5)*2);off[a.id]=[DX[a.d]*a.dist*k*0.5*s*1.6,DY[a.d]*a.dist*k*0.5*s*1.6];}if(a.type==='shake'){var m=Math.sin(a.t*40)*(1-a.t)*s*0.06;off[a.id]=[DX[a.d]*m,DY[a.d]*m];}if(a.type==='fly')flying[a.id]=a;});
 // hint path
 if(hintId>=0&&!removed[hintId]){var hp=lv.pieces[hintId],hd=dirOf(hp);ctx.save();ctx.strokeStyle='rgba(255,230,150,'+(0.4+0.3*Math.sin(now*0.008))+')';ctx.lineWidth=3;ctx.setLineDash([6,8]);ctx.lineDashOffset=-now*0.04;ctx.beginPath();var sx=B.x+(hp.x+.5)*s,sy=B.y+(hp.y+.5)*s;ctx.moveTo(sx,sy);ctx.lineTo(sx+DX[hd]*s*20,sy+DY[hd]*s*20);ctx.stroke();ctx.restore();}
 lv.pieces.forEach(function(p){if(removed[p.id]&&!flying[p.id])return;var cx=B.x+(p.x+.5)*s,cy=B.y+(p.y+.5)*s,al=1,gl=s*0.35;
  var f=flying[p.id];if(f){var e=ease(Math.min(1,f.t));cx+=DX[f.d]*e*Math.max(W,H)*1.2;cy+=DY[f.d]*e*Math.max(W,H)*1.2;al=1-Math.max(0,f.t-0.5)*2;gl=s*0.9;if(Math.random()<0.8)parts.push({x:cx,y:cy,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:0.7,col:COLS[p.c][0],r:Math.random()*2+1});}
  if(off[p.id]){cx+=off[p.id][0];cy+=off[p.id][1];}
  var pulse=(p.id===hintId)?1+0.08*Math.sin(now*0.012):1;
  lantern(cx,cy,s*pulse,p,f?f.d*Math.PI/2:spinVis[p.id],al,gl,now);});
 // particles
 ctx.globalCompositeOperation='lighter';for(var i=parts.length-1;i>=0;i--){var q=parts[i];q.life-=dt*1.4;if(q.life<=0){parts.splice(i,1);continue;}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=40*dt;ctx.globalAlpha=q.life;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.28);ctx.fill();}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 for(var i=floats.length-1;i>=0;i--){var f2=floats[i];f2.t+=dt;if(f2.t>1){floats.splice(i,1);continue;}ctx.globalAlpha=1-f2.t;ctx.fillStyle=f2.c;ctx.font='bold '+Math.round(s*0.4)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(f2.s,f2.x,f2.y-f2.t*40);}ctx.globalAlpha=1;
 if(tutT>0){ctx.globalAlpha=Math.min(1,tutT);ctx.fillStyle='rgba(255,240,210,0.95)';ctx.font='600 '+Math.max(13,Math.min(17,W/26))+'px system-ui,sans-serif';ctx.textAlign='center';var msg=(lv.level===4)?L.tut2:L.tut;ctx.fillText(msg,W/2,B.y+lv.rows*s+34);ctx.globalAlpha=1;}}
var last=performance.now(),firstFrame=false;
function loop(now){var dt=Math.min(0.05,(now-last)/1000);last=now;if(!paused){for(var i=anims.length-1;i>=0;i--){var a=anims[i];a.t+=dt*(a.type==='fly'?1.6:a.type==='bump'?2.6:2.5);if(a.t>=1)anims.splice(i,1);}if(tutT>0&&tutT<5.9)tutT-=dt*0.0;}
